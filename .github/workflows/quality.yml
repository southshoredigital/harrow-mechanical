name: Quality gates

# Runs on every pull request and on main. A red job blocks the merge once
# branch protection requires these checks; that setting lives in the GitHub
# repository, not in this file.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate the Linux visual baselines and upload them as an artifact"
        type: boolean
        default: false

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PORT: 3100
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build, lint, types, content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `pnpm build` runs tokens and check-content (em dashes, en dashes,
      # curly quotes) before next build, so a content failure stops here.
      - run: pnpm build
      # After build, so next-env.d.ts and the route types exist.
      - run: pnpm typecheck

  e2e:
    name: Playwright (axe, keyboard, contrast, forms, documents, visual)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium

      - name: Run the suite
        if: ${{ !inputs.update_snapshots }}
        run: pnpm test:e2e
        env:
          CI: true

      - name: Regenerate Linux visual baselines
        if: ${{ inputs.update_snapshots }}
        run: pnpm exec playwright test visual.spec.ts --update-snapshots
        env:
          CI: true

      - name: Upload Linux baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/e2e/__snapshots__/**/*-linux.png

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  performance:
    name: Performance budget
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium

      - name: Start production server
        run: |
          pnpm exec next start -p "$PORT" &
          for i in $(seq 1 60); do
            curl -sf "http://localhost:$PORT/" > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not start" && exit 1

      # Splits each page's own JS from chunks Next prefetches at idle for
      # linked routes, and checks the homepage animation stack.
      - name: Lab report (LCP, CLS, JS, animation stack)
        run: node scripts/perf-report.mjs "http://localhost:$PORT"

      - name: Lighthouse against lighthouse/budget.json
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
